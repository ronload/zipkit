version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # typescript 7 is the native compiler and ships a different npm package
      # layout (no lib/typescript.js). typescript-eslint peer-requires <6.1.0
      # and next resolves the TS integration through lib/typescript.js, so both
      # eslint and next build crash. Drop this once both support TS 7.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      # One group keeps every npm update in a single PR. With separate groups
      # each PR rewrites pnpm-lock.yaml, and after one merges, git can merge
      # the other without conflicts into an invalid lockfile.
      npm-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
